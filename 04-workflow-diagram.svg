<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="800" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Xanh SM — Quy trình xử lý xe EV pin nguy cấp (Current State)</text>
  <text x="800" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">Tổng thời gian trung bình: 18 phút / yêu cầu</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70,245)"><rect width="260" height="260" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="130" y="55" text-anchor="middle" font-size="25" font-weight="700" fill="#0c4a6e">1. Tài xế báo sự cố</text><text x="130" y="105" text-anchor="middle" font-size="19" fill="#164e63">Chat hoặc gọi tổng đài</text><text x="130" y="140" text-anchor="middle" font-size="19" fill="#164e63">Pin + vị trí sơ bộ</text><text x="130" y="205" text-anchor="middle" font-size="23" font-weight="700" fill="#0369a1">⏱ 2 phút</text></g>
    <g transform="translate(390,245)"><rect width="260" height="260" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="130" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#7f1d1d">2. Hỏi lại thông tin</text><text x="130" y="90" text-anchor="middle" font-size="19" fill="#7f1d1d">Tổng đài xác nhận</text><text x="130" y="120" text-anchor="middle" font-size="19" fill="#7f1d1d">xe, pin, vị trí,</text><text x="130" y="150" text-anchor="middle" font-size="19" fill="#7f1d1d">tình trạng giao thông</text><text x="130" y="195" text-anchor="middle" font-size="21" font-weight="700" fill="#dc2626">🔴 BOTTLENECK</text><text x="130" y="232" text-anchor="middle" font-size="23" font-weight="700" fill="#b91c1c">⏱ 4 phút</text></g>
    <g transform="translate(710,245)"><rect width="260" height="260" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="130" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#7f1d1d">3. Tra cứu trạm</text><text x="130" y="90" text-anchor="middle" font-size="19" fill="#7f1d1d">Mở bản đồ và hệ</text><text x="130" y="120" text-anchor="middle" font-size="19" fill="#7f1d1d">thống trạm sạc</text><text x="130" y="150" text-anchor="middle" font-size="19" fill="#7f1d1d">thủ công</text><text x="130" y="195" text-anchor="middle" font-size="21" font-weight="700" fill="#dc2626">🔴 BOTTLENECK</text><text x="130" y="232" text-anchor="middle" font-size="23" font-weight="700" fill="#b91c1c">⏱ 5 phút</text></g>
    <g transform="translate(1030,245)"><rect width="260" height="260" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="130" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#78350f">4. Điều phối</text><text x="130" y="96" text-anchor="middle" font-size="19" fill="#78350f">Gọi xe sạc lưu động</text><text x="130" y="128" text-anchor="middle" font-size="19" fill="#78350f">hoặc hướng dẫn</text><text x="130" y="158" text-anchor="middle" font-size="19" fill="#78350f">đến trạm</text><text x="130" y="222" text-anchor="middle" font-size="23" font-weight="700" fill="#b45309">⏱ 4 phút</text></g>
    <g transform="translate(1350,245)"><rect width="190" height="260" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="95" y="52" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">5. Xác nhận</text><text x="95" y="96" text-anchor="middle" font-size="18" fill="#14532d">Nhắn lại</text><text x="95" y="126" text-anchor="middle" font-size="18" fill="#14532d">tài xế</text><text x="95" y="222" text-anchor="middle" font-size="23" font-weight="700" fill="#15803d">⏱ 3 phút</text></g>
    <path d="M330 375 H375 M650 375 H695 M970 375 H1015 M1290 375 H1335" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="360" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#7c3aed">🔄 HANDOFF</text><text x="1010" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#7c3aed">🔄 HANDOFF</text>
  </g>
  <rect x="210" y="650" width="1180" height="120" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="800" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#4c1d95">Rủi ro cần kiểm soát</text><text x="800" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#5b21b6">Thông tin thiếu hoặc tra cứu sai có thể dẫn đến gợi ý trạm quá xa khi pin dưới 5%.</text>
</svg>
